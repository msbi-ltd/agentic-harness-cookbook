name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        # Pinned, not ambient: don't depend on whatever the runner happens to
        # ship. requirements-dev.txt pins pytest + ruff to exact versions.
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check scripts/ tests/
      - name: Test (pytest, all three exit paths)
        run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ShellCheck the hook example
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: ".claude/hooks"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate YAML blocks and Markdown links
        # markdown-link-check verifies every cross-reference resolves; yamllint
        # catches a malformed workflow/example before it's copied out.
        run: |
          pipx run yamllint .
          npx --yes markdown-link-check --quiet README.md patterns/*.md CONTRIBUTING.md SECURITY.md
